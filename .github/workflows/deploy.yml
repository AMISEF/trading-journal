name: Deploy Trading Journal to VPS

# Deploys ONLY the trading-journal app. The existing cryptosmart.site site
# is untouched — it lives in its own folder, PM2 process, and Nginx block.
#
# The workflow only syncs the repo and hands off to deploy/remote_deploy.sh,
# which is the single source of truth for what a deploy does. The pre-sync HEAD
# is passed along so the script can rebuild only what changed:
#   * backend-only push → pm2 restart, seconds
#   * frontend push     → one journal build (the pnl site is opt-in)
#   * docs-only push    → nothing
#
# Debug a failing deploy by running the same script on the box:
#
#     bash /var/www/trading-journal/deploy/remote_deploy.sh
#
# Restart the services without rebuilding anything:
#
#     SKIP_BUILD=1 bash /var/www/trading-journal/deploy/remote_deploy.sh
#
# Force a full rebuild of both sites:
#
#     FORCE_ALL=1 bash /var/www/trading-journal/deploy/remote_deploy.sh

on:
  push:
    branches:
      - main
  # Lets a deploy be re-run from the Actions tab without an empty commit.
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild everything (journal + pnl), ignoring change detection"
        type: boolean
        default: false
      skip_build:
        description: "Restart PM2 only — no Next.js build at all"
        type: boolean
        default: false

# Two concurrent Next builds are the fastest way to run this VPS out of memory.
concurrency:
  group: deploy-trading-journal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 40m
          script_stop: true
          envs: FORCE_ALL,SKIP_BUILD
          script: |
            set -e
            cd /var/www/trading-journal
            # Remember what is deployed right now so the script can diff against it.
            export DEPLOY_PREV_SHA="$(git rev-parse HEAD)"
            git fetch origin main
            git reset --hard origin/main
            git log -1 --oneline
            chmod +x deploy/remote_deploy.sh
            bash deploy/remote_deploy.sh
        env:
          FORCE_ALL: ${{ inputs.force_all && '1' || '0' }}
          SKIP_BUILD: ${{ inputs.skip_build && '1' || '0' }}
