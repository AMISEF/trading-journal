name: Deploy Trading Journal to VPS

# Deploys ONLY the trading-journal app. The existing cryptosmart.site site
# is untouched — it lives in its own folder, PM2 process, and Nginx block.
#
# The workflow only syncs the repo and hands off to deploy/remote_deploy.sh,
# which is the single source of truth for what a deploy does. The pre-sync HEAD
# is passed along so the script can rebuild only what changed (a backend-only
# push skips both Next builds). Debug a failing deploy by running that same
# script on the box:
#
#     bash /var/www/trading-journal/deploy/remote_deploy.sh
#
# Force a full rebuild when you need one:
#
#     FORCE_ALL=1 bash /var/www/trading-journal/deploy/remote_deploy.sh

on:
  push:
    branches:
      - main
  # Lets a failed deploy be retried from the Actions tab without an empty commit.
  workflow_dispatch:
    inputs:
      force_all:
        description: "Rebuild everything, ignoring change detection"
        type: boolean
        default: false

# Two concurrent Next builds are the fastest way to run this VPS out of memory.
concurrency:
  group: deploy-trading-journal
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 40m
          script_stop: true
          envs: FORCE_ALL
          script: |
            set -e
            cd /var/www/trading-journal
            # Remember what is deployed right now so the script can diff against it.
            export DEPLOY_PREV_SHA="$(git rev-parse HEAD)"
            git fetch origin main
            git reset --hard origin/main
            git log -1 --oneline
            chmod +x deploy/remote_deploy.sh
            bash deploy/remote_deploy.sh
        env:
          FORCE_ALL: ${{ inputs.force_all && '1' || '0' }}
